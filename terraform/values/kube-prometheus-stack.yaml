# Trimmed for a laptop kind cluster.
alertmanager:
  enabled: false        # alerts are visible in the Prometheus UI; no routing needed for the demo
nodeExporter:
  enabled: false

# kind does not expose these control-plane endpoints, so their targets would always show as down.
kubeEtcd:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    # Pick up ServiceMonitors and PrometheusRules from every namespace,
    # not only those carrying this Helm release's label.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 2d

grafana:
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
