# Argo CD watches this Git repo and keeps the cluster matching charts/demo-service.
# Change values.yaml, push to main, and Argo CD rolls the change out.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/srghosh56/gitops-microservice-demo.git
    targetRevision: main
    path: charts/demo-service
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true      # delete resources that were removed from Git
      selfHeal: true   # undo manual changes made with kubectl
    syncOptions:
      - CreateNamespace=true
